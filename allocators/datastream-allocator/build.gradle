plugins {
    id 'java'
}

group = 'io.github.hsiam261'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

ext {
    opensearchVersion = findProperty('opensearchVersion') ?: '2.19.0'
}

repositories {
    mavenCentral()
    maven { url 'https://aws.oss.sonatype.org/content/repositories/releases/' }
}

dependencies {
    compileOnly "org.opensearch:opensearch:${opensearchVersion}"

    testImplementation "org.opensearch.test:framework:${opensearchVersion}"
    testImplementation 'junit:junit:4.13.2'
}

task generatePluginDescriptor {
    def outputDir = layout.buildDirectory.dir('plugin-metadata')
    outputs.dir outputDir
    doLast {
        def dir = outputDir.get().asFile
        dir.mkdirs()
        new File(dir, 'plugin-descriptor.properties').text = """\
            |description=Datastream-aware shard allocator that balances shards by datastream across nodes
            |version=${version}
            |name=datastream-allocator
            |classname=io.github.hsiam261.datastreamallocator.DatastreamAllocatorPlugin
            |java.version=11
            |opensearch.version=${opensearchVersion}
            |""".stripMargin()
    }
}

task bundlePlugin(type: Zip) {
    dependsOn jar, generatePluginDescriptor
    archiveFileName = "${rootProject.name}-${version}-opensearch-${opensearchVersion}.zip"
    destinationDirectory = layout.buildDirectory.dir('distributions')
    from jar
    from(layout.buildDirectory.dir('plugin-metadata'))
}
